repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (scraper)
        entry: uv run --project scraper ruff format
        language: system
        types: [python]
        files: ^scraper/
      - id: ruff-check
        name: ruff check (scraper)
        entry: uv run --project scraper ruff check --fix
        language: system
        types: [python]
        files: ^scraper/
      - id: mypy
        name: mypy --strict (scraper)
        entry: uv run --directory scraper mypy
        language: system
        types: [python]
        files: ^scraper/
        pass_filenames: false
