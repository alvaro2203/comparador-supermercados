name: scraper-ci

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/ci.yml"
  pull_request:

defaults:
  run:
    working-directory: scraper

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "scraper/uv.lock"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-fail-under=90

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scraper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SCRAPER_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/scraper
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "scraper/uv.lock"
      - run: uv sync --locked --extra postgres
      - run: uv run pytest tests/integration --no-cov
