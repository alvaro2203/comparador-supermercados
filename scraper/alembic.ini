# Developer configuration for the Alembic command line, run from scraper/:
#   uv run alembic revision --autogenerate --rev-id 0002 -m "add x"
#   uv run alembic upgrade head
# The database URL comes from SCRAPER_DATABASE_URL (or .env), not from this file.
# The application does not read this file: it migrates through upgrade_schema() on init-db and run.

[alembic]
script_location = supermarket_scraper.infrastructure.persistence:migrations
file_template = v%%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff_format, ruff_check
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
